<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Payment | Shepherd</title>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #222;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 30px #00000014;
        }

        h2 { color: #4f46e5; margin-bottom: 8px; }

        .subtitle {
            color: #6b7280;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .form-group { margin-bottom: 18px; }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px #4f46e51a;
        }

        button {
            width: 100%;
            padding: 13px;
            border: 0;
            border-radius: 10px;
            background: #4f46e5;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover { background: #4338ca; }
        button:disabled { background: #9ca3af; cursor: not-allowed; }

        .message {
            margin-top: 18px;
            padding: 12px;
            border-radius: 10px;
            display: none;
            font-size: 14px;
        }

        .success {
            display: block;
            background: #ecfdf5;
            color: #047857;
            border: 1px solid #a7f3d0;
        }

        .error {
            display: block;
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #4f46e5;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Update Payment</h2>

    <p class="subtitle">
        Enter the payment details to update the visit bill.
    </p>

    <form id="paymentForm">

        <div class="form-group">
            <label for="faculty_id">Faculty ID</label>
            <input type="text" id="faculty_id" placeholder="Enter faculty ID" required>
        </div>

        <div class="form-group">
            <label for="visit_id">Visit ID</label>
            <input type="number" id="visit_id" placeholder="Enter visit ID" min="1" required>
        </div>

        <div class="form-group">
            <label for="transaction_id">Transaction ID</label>
            <input type="text" id="transaction_id" placeholder="Enter transaction ID" required>
        </div>

        <div class="form-group">
            <label for="transaction_date">Transaction Date</label>
            <input type="date" id="transaction_date" required>
        </div>

        <button type="submit" id="submitBtn">Update Payment</button>

    </form>

    <div id="message" class="message" role="status"></div>

    <a class="back" href="/">API home</a>

</div>

<script>
const form = document.getElementById('paymentForm');
const message = document.getElementById('message');
const submitBtn = document.getElementById('submitBtn');

form.addEventListener('submit', async e => {

    e.preventDefault();

    message.className = 'message';
    message.style.display = 'none';

    submitBtn.disabled = true;
    submitBtn.textContent = 'Updating...';

    const body = new FormData();

    body.append('faculty_id', document.getElementById('faculty_id').value.trim());
    body.append('visit_id', document.getElementById('visit_id').value.trim());
    body.append('transaction_id', document.getElementById('transaction_id').value.trim());
    body.append('transaction_date', document.getElementById('transaction_date').value);

    try {

        const response = await fetch('/api/payment_update', {
            method: 'POST',
            body: body
        });

        const data = await response.json();

        message.className = 'message ' + (data.status ? 'success' : 'error');
        message.textContent = data.message || 'Payment update failed';
        message.style.display = 'block';

        if (data.status) {
            form.reset();
        }

    } catch (error) {

        message.className = 'message error';
        message.textContent = 'Unable to connect to the API.';
        message.style.display = 'block';

    } finally {

        submitBtn.disabled = false;
        submitBtn.textContent = 'Update Payment';

    }

});
</script>

</body>
</html>
